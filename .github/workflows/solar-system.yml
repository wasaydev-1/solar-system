name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://wasay:wasay%40654@cluster0.5vx6n24.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0'
    MONGO_USERNAME: '${{vars.MONGO_USERNAME}}'
    MONGO_PASSWORD: '${{secrets.MONGO_PASSWORD}}'   
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v3
          with:
            node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
       